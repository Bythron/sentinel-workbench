[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-workbench"
version = "0.2.0"
description = "Authorized local inventory, passive HTTPS checks and evidence workbench"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "fastapi>=0.115,<1", "ruff>=0.9,<1", "pip-audit>=2.7,<3"]

[project.scripts]
sentinel = "sentinel_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel_workbench = ["manifests/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

